<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Beauty Salon</title>
  <meta name="description" content="Sign in to Beauty Salon to manage your appointments, check your queue position, and reserve seats.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 2.25rem 2.5rem;
      background: #ffffff;
      border: 1px solid var(--be-border);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
    }
    .loading-dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin: 0 2px;
      background: #fff;
      border-radius: 50%;
      animation: dots 1.2s infinite ease-in-out both;
    }
    .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
    .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes dots {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>
<body class="auth-wrapper" style="background-color: var(--be-dark);">

  <div class="auth-card fb-feed-card" style="border-radius: 8px;">

    <!-- Brand -->
    <div class="text-center mb-4">
      <h3 class="fw-bold text-dark mb-1">Beauty Salon</h3>
    </div>

    <!-- Alert Container -->
    <div id="alert-container"></div>

    <form onsubmit="handleLogin(event)" id="login-form" novalidate>

      <div class="mb-3">
        <label for="email" class="form-label small text-muted">Email Address</label>
        <input type="email" class="form-control" id="email" required
          placeholder="name@example.com" autocomplete="email">
      </div>

      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="password" class="form-label small text-muted mb-0">Password</label>
          <a href="#" onclick="showForgotPasswordAlert()" class="text-decoration-none" style="font-size:0.8rem;color:var(--be-primary)">
            Forgot password?
          </a>
        </div>
        <input type="password" class="form-control" id="password" required
          placeholder="Password" autocomplete="current-password">
      </div>

      <button type="submit" class="fb-btn-primary w-100 py-2 fs-6" id="login-btn">
        Log In
      </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top" style="border-color:var(--be-border)!important">
      <p class="text-muted small mb-1">Don't have an account?
        <a href="/auth/register.html" class="text-decoration-none fw-bold" style="color:var(--be-primary)">Create new account</a>
      </p>
      <p class="mb-0">
        <a href="/auth/admin-login.html" class="text-secondary text-decoration-none" style="font-size:0.78rem">
          Admin Portal
        </a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Handle login submit
    window.handleLogin = async function(event) {
      event.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span>';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Login failed. Please check credentials.');

        localStorage.setItem('barber_token', data.data.token);
        localStorage.setItem('barber_user', JSON.stringify(data.data.customer));
        localStorage.setItem('barber_user_type', 'customer');

        btn.innerHTML = 'Signed In!';
        btn.className = 'btn btn-primary w-100 py-2 fw-bold';

        setTimeout(() => { window.location.href = '/customer/dashboard.html'; }, 900);
      } catch (error) {
        btn.disabled = false;
        btn.innerHTML = 'Log In';
        const ac = document.getElementById('alert-container');
        ac.innerHTML = `<div class="alert alert-danger alert-dismissible fade show py-2 small" role="alert">
          ${error.message}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
      }
    };
  </script>
</body>
</html>
