<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings — BarberEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color: var(--be-dark);">

  <!-- ═══ FACEBOOK TOP NAVIGATION BAR ═══ -->
  <nav class="fb-navbar fixed-top d-flex align-items-center justify-content-between">
    <!-- Left: Brand Logo & Search Pill -->
    <div class="d-flex align-items-center gap-3">
      <a class="fb-brand" href="/customer/dashboard.html">
        <div class="fb-logo-icon">
          <i class="fa-solid fa-scissors"></i>
        </div>
        <span class="d-none d-sm-inline fw-bold">Beauty Salon</span>
      </a>
      <div class="fb-search-bar d-none d-md-flex">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search chairs, services..." />
      </div>
    </div>

    <!-- Center: Facebook Icon Tabs -->
    <div class="fb-nav-center">
      <a class="fb-nav-tab" href="/customer/dashboard.html" title="Service Chairs">
        <i class="fa-solid fa-chair"></i>
      </a>
      <a class="fb-nav-tab" href="/customer/queue.html" title="Waiting Queue">
        <i class="fa-solid fa-users"></i>
      </a>
      <a class="fb-nav-tab active" href="/customer/profile.html" title="Account Profile">
        <i class="fa-solid fa-circle-user"></i>
      </a>
    </div>

    <!-- Right: Facebook Utility Circular Buttons & Logout -->
    <div class="fb-right-actions">
      <a href="/customer/dashboard.html" class="fb-btn-secondary d-none d-sm-inline-flex align-items-center gap-1 text-decoration-none">
        <i class="fa-solid fa-chair" style="color:var(--be-primary)"></i>
        <span>Chairs</span>
      </a>
      <button class="fb-circle-btn" onclick="handleLogout()" title="Log Out">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
      </button>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container" style="margin-top: 76px; margin-bottom: 50px; max-width: 1000px;">
    
    <!-- Facebook Style Header Feed Card -->
    <div class="fb-feed-card p-4 mb-4">
      <div class="d-flex align-items-center gap-3">
        <div class="fb-avatar fb-avatar-blue" style="width:54px;height:54px;font-size:1.5rem">
          <i class="fa-solid fa-user-gear"></i>
        </div>
        <div>
          <h3 class="fw-bold mb-0 text-dark">Account Settings</h3>
          <p class="text-muted small mb-0">Manage your profile information, contact numbers, and security password.</p>
        </div>
      </div>
    </div>

    <!-- Alert Container -->
    <div id="alert-container"></div>

    <div class="row g-4">
      <!-- Profile Info Card -->
      <div class="col-md-6">
        <div class="fb-feed-card shadow-sm">
          <div class="fb-feed-header">
            <h5 class="mb-0 fw-bold fs-6 text-dark"><i class="fa-solid fa-id-card me-2" style="color:var(--be-primary)"></i>Personal Details</h5>
          </div>
          <div class="p-3">
            <form onsubmit="handleUpdateProfile(event)">
              <div class="mb-3">
                <label for="profile-name" class="form-label small text-muted">Full Name</label>
                <input type="text" class="form-control" id="profile-name" required>
              </div>

              <div class="mb-3">
                <label for="profile-email" class="form-label small text-muted">Email Address (Read Only)</label>
                <input type="email" class="form-control text-muted" id="profile-email" readonly style="background:#f1f5f9">
              </div>

              <div class="mb-3">
                <label for="profile-phone" class="form-label small text-muted">Phone Number</label>
                <input type="tel" class="form-control" id="profile-phone" required>
              </div>

              <div class="mb-3">
                <label for="profile-gender" class="form-label small text-muted">Gender</label>
                <select class="form-select" id="profile-gender">
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                  <option value="other">Other</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="profile-address" class="form-label small text-muted">Address</label>
                <textarea class="form-control" id="profile-address" rows="2"></textarea>
              </div>

              <button type="submit" class="fb-btn-primary w-100 py-2">
                <i class="fa-solid fa-floppy-disk me-2"></i>Save Profile Changes
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Security / Change Password -->
      <div class="col-md-6">
        <div class="fb-feed-card shadow-sm">
          <div class="fb-feed-header">
            <h5 class="mb-0 fw-bold fs-6 text-dark"><i class="fa-solid fa-shield-halved me-2" style="color:var(--be-primary)"></i>Security Preferences</h5>
          </div>
          <div class="p-3">
            <form onsubmit="handleChangePassword(event)">
              <div class="mb-3">
                <label for="current-password" class="form-label small text-muted">Current Password</label>
                <input type="password" class="form-control" id="current-password" required placeholder="••••••••">
              </div>

              <div class="mb-3">
                <label for="new-password" class="form-label small text-muted">New Password</label>
                <input type="password" class="form-control" id="new-password" required placeholder="••••••••">
              </div>

              <div class="mb-3">
                <label for="confirm-password" class="form-label small text-muted">Confirm New Password</label>
                <input type="password" class="form-control" id="confirm-password" required placeholder="••••••••">
              </div>

              <button type="submit" class="fb-btn-secondary w-100 py-2">
                <i class="fa-solid fa-key me-2"></i>Update Password
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/profile.js"></script>
  <script>
    checkAuth('customer');
  </script>
</body>
</html>
